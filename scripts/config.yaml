        source: "D:/INPE/INPE2026/e-BDC/Devo/creator_cs/fillcell_python/dados/pall_2020_epsg_5880.shp"
        out_column: "pall"

  # ===========================================================================
  # B. CENÁRIO VE (Transição Ecológica)
  # ===========================================================================
  - target_gpkg: "dados/scenarios/VE/ecube_2027.gpkg"
